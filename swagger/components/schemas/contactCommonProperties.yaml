userId:
  description: 'ID of the user who owns the contact'
  type: string
  example: 65e4decdd286b30065d54af9
name:
  description: "Contact's name"
  type: string
  example: 'Jane Doe'
phoneNumber:
  description: "Contact's phone number"
  type: string
  example: '+1234567890'
email:
  description: "Contact's email"
  type: string
  format: email
  example: 'jane.doe@example.com'
isFavourite:
  description: 'Whether the contact is marked as favourite'
  type: boolean
  example: true
contactType:
  $ref: contactType.yaml
photo:
  description: "Contact's photo"
  type: string
  format: binary
